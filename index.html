    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = 'dark'

      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
